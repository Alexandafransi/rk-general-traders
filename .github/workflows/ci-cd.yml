name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # ghcr.io requires lowercase (github.repository would give "Alexandafransi/...")
  IMAGE: ghcr.io/alexandafransi/rk-general-traders

jobs:
  # ── CI: build the Next.js app ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ── Build the production image and push it to GitHub Container Registry ──
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Single-origin app: the browser calls relative /api paths and the
          # frontend proxies them to the backend at runtime, so no public API
          # URL is baked into the bundle.
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to the shared droplet via Ansible ──
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pipx install ansible-core
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Run deploy playbook
        working-directory: deploy/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook deploy.yml \
            -i inventory.ini \
            --private-key ~/.ssh/deploy_key \
            -e image="${{ env.IMAGE }}:${{ github.sha }}" \
            -e ghcr_user="${{ github.actor }}" \
            -e ghcr_token="${{ secrets.GITHUB_TOKEN }}" \
            -e domain="${{ vars.DOMAIN || 'rk.kezmak.co.tz' }}"
